<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>脑肿瘤智能检测系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4a90e2;
            --success-color: #52c41a;
            --warning-color: #faad14;
            --danger-color: #f5222d;
            --dark-color: #1a1a2e;
            --light-bg: #f8f9fa;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px 0;
        }

        .main-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            margin: 20px auto;
            max-width: 1200px;
        }

        .header-section {
            background: linear-gradient(135deg, var(--dark-color), #16213e);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .header-section h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header-section p {
            font-size: 1.1rem;
            opacity: 0.9;
            margin: 0;
        }

        .content-section {
            padding: 40px 30px;
        }

        .upload-area {
            border: 3px dashed #d0d0d0;
            border-radius: 15px;
            padding: 60px 20px;
            text-align: center;
            transition: all 0.3s ease;
            background: var(--light-bg);
            cursor: pointer;
            position: relative;
        }

        .upload-area:hover {
            border-color: var(--primary-color);
            background: #f0f8ff;
        }

        .upload-area.dragover {
            border-color: var(--primary-color);
            background: #e6f3ff;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 4rem;
            color: var(--primary-color);
            margin-bottom: 20px;
        }

        .image-preview {
            max-width: 100%;
            max-height: 400px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            margin: 20px auto;
            display: none;
        }

        .result-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .result-card:hover {
            transform: translateY(-5px);
        }

        .result-header {
            padding: 20px;
            color: white;
            font-weight: 600;
            font-size: 1.2rem;
        }

        .result-positive {
            background: linear-gradient(135deg, #f5222d, #ff4757);
        }

        .result-negative {
            background: linear-gradient(135deg, #52c41a, #73d13d);
        }

        .confidence-bar {
            height: 8px;
            background: #e9ecef;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }

        .confidence-fill {
            height: 100%;
            transition: width 1s ease;
            border-radius: 10px;
        }

        .confidence-high {
            background: linear-gradient(90deg, #52c41a, #73d13d);
        }

        .confidence-medium {
            background: linear-gradient(90deg, #faad14, #ffc53d);
        }

        .confidence-low {
            background: linear-gradient(90deg, #f5222d, #ff4757);
        }

        .stats-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        .stats-icon {
            font-size: 2rem;
            margin-bottom: 15px;
        }

        .model-info {
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
        }

        .loading-spinner {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .spinner-grow {
            width: 3rem;
            height: 3rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), #3a7bd5);
            border: none;
            padding: 12px 30px;
            font-weight: 600;
            border-radius: 50px;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(74,144,226,0.3);
        }

        .alert-custom {
            border: none;
            border-radius: 10px;
            padding: 15px 20px;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .pulse {
            animation: pulse 2s infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-container">
            <!-- 头部区域 -->
            <div class="header-section">
                <div class="row align-items-center">
                    <div class="col-md-8">
                        <h1><i class="fas fa-brain me-3"></i>脑肿瘤智能检测系统</h1>
                        <p>基于深度学习的EfficientNetV2-S模型 • 准确率75.49% • F1分数79.87%</p>
                    </div>
                    <div class="col-md-4 text-end">
                        <div class="badge bg-success fs-6 mb-2">AI Powered</div>
                        <br>
                        <small class="text-white-50">v1.0.0</small>
                    </div>
                </div>
            </div>

            <!-- 主要内容区域 -->
            <div class="content-section">
                <div class="row">
                    <!-- 左侧：上传区域 -->
                    <div class="col-lg-6">
                        <div class="upload-area" id="uploadArea">
                            <input type="file" id="fileInput" accept="image/*" style="display: none;">
                            <div class="upload-icon">
                                <i class="fas fa-cloud-upload-alt"></i>
                            </div>
                            <h4>点击或拖拽上传脑部图像</h4>
                            <p class="text-muted mb-3">支持 JPG, PNG, BMP, TIFF 格式 • 最大16MB</p>
                            <button class="btn btn-primary btn-lg" onclick="document.getElementById('fileInput').click()">
                                <i class="fas fa-upload me-2"></i>选择图片
                            </button>
                        </div>

                        <!-- 图片预览区域 -->
                        <img id="imagePreview" class="image-preview" alt="预览图像">

                        <!-- 加载动画 -->
                        <div class="loading-spinner" id="loadingSpinner">
                            <div class="spinner-grow text-primary" role="status">
                                <span class="visually-hidden">检测中...</span>
                            </div>
                            <p class="mt-3">AI正在进行智能分析，请稍候...</p>
                        </div>

                        <!-- 操作按钮 -->
                        <div class="d-grid gap-2 mt-3" id="actionButtons" style="display: none;">
                            <button class="btn btn-primary btn-lg" onclick="analyzeImage()">
                                <i class="fas fa-search me-2"></i>开始检测
                            </button>
                            <button class="btn btn-outline-secondary" onclick="resetUpload()">
                                <i class="fas fa-redo me-2"></i>重新选择
                            </button>
                        </div>
                    </div>

                    <!-- 右侧：结果显示区域 -->
                    <div class="col-lg-6">
                        <!-- 模型信息卡片 -->
                        <div class="model-info">
                            <h5 class="mb-3"><i class="fas fa-info-circle me-2"></i>模型信息</h5>
                            <div class="row">
                                <div class="col-6">
                                    <small class="text-muted">模型架构</small>
                                    <p class="mb-2 fw-bold">EfficientNetV2-S</p>
                                </div>
                                <div class="col-6">
                                    <small class="text-muted">输入尺寸</small>
                                    <p class="mb-2 fw-bold">224x224</p>
                                </div>
                                <div class="col-6">
                                    <small class="text-muted">准确率</small>
                                    <p class="mb-2 fw-bold text-success">75.49%</p>
                                </div>
                                <div class="col-6">
                                    <small class="text-muted">F1分数</small>
                                    <p class="mb-2 fw-bold text-info">79.87%</p>
                                </div>
                            </div>
                        </div>

                        <!-- 检测结果区域 -->
                        <div id="resultArea" style="display: none;">
                            <div class="result-card">
                                <div class="result-header" id="resultHeader">
                                    <i class="fas fa-microscope me-2"></i>
                                    <span id="resultTitle">检测结果</span>
                                </div>
                                <div class="card-body">
                                    <h5 class="card-title" id="predictionResult">--</h5>
                                    
                                    <div class="mb-3">
                                        <small class="text-muted">置信度</small>
                                        <div class="d-flex align-items-center">
                                            <div class="confidence-bar flex-grow-1 me-3">
                                                <div class="confidence-fill" id="confidenceBar"></div>
                                            </div>
                                            <span class="fw-bold" id="confidenceValue">--%</span>
                                        </div>
                                    </div>

                                    <div class="mb-3">
                                        <small class="text-muted">肿瘤概率</small>
                                        <div class="d-flex align-items-center">
                                            <div class="confidence-bar flex-grow-1 me-3">
                                                <div class="confidence-fill" id="tumorProbBar"></div>
                                            </div>
                                            <span class="fw-bold" id="tumorProbValue">--%</span>
                                        </div>
                                    </div>

                                    <div class="alert alert-custom" id="recommendationAlert">
                                        <i class="fas fa-info-circle me-2"></i>
                                        <span id="recommendationText">--</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 快速统计 -->
                        <div class="row mt-4" id="statsArea" style="display: none;">
                            <div class="col-6">
                                <div class="stats-card text-center">
                                    <div class="stats-icon text-primary">
                                        <i class="fas fa-brain"></i>
                                    </div>
                                    <h6 class="text-muted">分析图像</h6>
                                    <p class="mb-0 fw-bold" id="analyzedImages">0</p>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="stats-card text-center">
                                    <div class="stats-icon text-success">
                                        <i class="fas fa-clock"></i>
                                    </div>
                                    <h6 class="text-muted">处理时间</h6>
                                    <p class="mb-0 fw-bold" id="processingTime">0ms</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let selectedFile = null;
        let analysisCount = 0;
        let startTime = null;

        // 初始化事件监听器
        document.addEventListener('DOMContentLoaded', function() {
            const uploadArea = document.getElementById('uploadArea');
            const fileInput = document.getElementById('fileInput');

            // 文件选择事件
            fileInput.addEventListener('change', handleFileSelect);

            // 拖拽事件
            uploadArea.addEventListener('dragover', handleDragOver);
            uploadArea.addEventListener('dragleave', handleDragLeave);
            uploadArea.addEventListener('drop', handleDrop);
            uploadArea.addEventListener('click', () => fileInput.click());
        });

        function handleDragOver(e) {
            e.preventDefault();
            e.currentTarget.classList.add('dragover');
        }

        function handleDragLeave(e) {
            e.preventDefault();
            e.currentTarget.classList.remove('dragover');
        }

        function handleDrop(e) {
            e.preventDefault();
            e.currentTarget.classList.remove('dragover');
            
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        }

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (file) {
                handleFile(file);
            }
        }

        function handleFile(file) {
            // 验证文件类型
            const allowedTypes = ['image/jpeg', 'image/jpg', 'image/png', 'image/bmp', 'image/tiff'];
            if (!allowedTypes.includes(file.type)) {
                showAlert('请选择有效的图像文件 (JPG, PNG, BMP, TIFF)', 'danger');
                return;
            }

            // 验证文件大小 (16MB)
            if (file.size > 16 * 1024 * 1024) {
                showAlert('文件大小不能超过16MB', 'danger');
                return;
            }

            selectedFile = file;
            displayImage(file);
        }

        function displayImage(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const preview = document.getElementById('imagePreview');
                preview.src = e.target.result;
                preview.style.display = 'block';
                
                document.getElementById('actionButtons').style.display = 'block';
                document.getElementById('resultArea').style.display = 'none';
                document.getElementById('statsArea').style.display = 'none';
            };
            reader.readAsDataURL(file);
        }

        async function analyzeImage() {
            if (!selectedFile) {
                showAlert('请先选择一张图像', 'warning');
                return;
            }

            const formData = new FormData();
            formData.append('file', selectedFile);

            // 显示加载动画
            document.getElementById('loadingSpinner').style.display = 'block';
            document.getElementById('actionButtons').style.display = 'none';
            
            startTime = Date.now();

            try {
                const response = await fetch('/api/predict', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();
                
                if (result.success) {
                    displayResult(result);
                    analysisCount++;
                } else {
                    showAlert(result.error || '检测失败', 'danger');
                }
            } catch (error) {
                console.error('Error:', error);
                showAlert('网络错误，请稍后重试', 'danger');
            } finally {
                document.getElementById('loadingSpinner').style.display = 'none';
                document.getElementById('actionButtons').style.display = 'block';
                updateStats();
            }
        }

        function displayResult(result) {
            const resultArea = document.getElementById('resultArea');
            const resultHeader = document.getElementById('resultHeader');
            const predictionResult = document.getElementById('predictionResult');
            const confidenceBar = document.getElementById('confidenceBar');
            const confidenceValue = document.getElementById('confidenceValue');
            const tumorProbBar = document.getElementById('tumorProbBar');
            const tumorProbValue = document.getElementById('tumorProbValue');
            const recommendationAlert = document.getElementById('recommendationAlert');
            const recommendationText = document.getElementById('recommendationText');

            // 显示结果区域
            resultArea.style.display = 'block';
            document.getElementById('statsArea').style.display = 'block';

            // 设置结果样式
            const hasTumor = result.prediction.includes('阳性');
            if (hasTumor) {
                resultHeader.className = 'result-header result-positive';
                recommendationAlert.className = 'alert alert-danger alert-custom';
            } else {
                resultHeader.className = 'result-header result-negative';
                recommendationAlert.className = 'alert alert-success alert-custom';
            }

            // 设置结果文本
            predictionResult.textContent = result.prediction;
            confidenceValue.textContent = (result.confidence * 100).toFixed(2) + '%';
            tumorProbValue.textContent = (result.tumor_probability * 100).toFixed(2) + '%';
            recommendationText.textContent = result.recommendation;

            // 设置进度条
            confidenceBar.style.width = (result.confidence * 100) + '%';
            confidenceBar.className = 'confidence-fill ' + getConfidenceClass(result.confidence);
            
            tumorProbBar.style.width = (result.tumor_probability * 100) + '%';
            tumorProbBar.className = 'confidence-fill ' + getConfidenceClass(result.tumor_probability);

            // 添加动画效果
            resultArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function getConfidenceClass(confidence) {
            if (confidence >= 0.8) return 'confidence-high';
            if (confidence >= 0.6) return 'confidence-medium';
            return 'confidence-low';
        }

        function updateStats() {
            document.getElementById('analyzedImages').textContent = analysisCount;
            if (startTime) {
                const processingTime = Date.now() - startTime;
                document.getElementById('processingTime').textContent = processingTime + 'ms';
            }
        }

        function resetUpload() {
            selectedFile = null;
            document.getElementById('fileInput').value = '';
            document.getElementById('imagePreview').style.display = 'none';
            document.getElementById('actionButtons').style.display = 'none';
            document.getElementById('resultArea').style.display = 'none';
            document.getElementById('statsArea').style.display = 'none';
        }

        function showAlert(message, type) {
            // 创建提示框
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type} alert-dismissible fade show position-fixed`;
            alertDiv.style.cssText = 'top: 20px; right: 20px; z-index: 9999; min-width: 300px;';
            alertDiv.innerHTML = `
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            
            document.body.appendChild(alertDiv);
            
            // 3秒后自动移除
            setTimeout(() => {
                if (alertDiv.parentNode) {
                    alertDiv.remove();
                }
            }, 3000);
        }

        // 页面加载时检查后端健康状态
        window.addEventListener('load', async function() {
            try {
                const response = await fetch('/api/health');
                const health = await response.json();
                
                if (health.status === 'healthy' && health.model_loaded) {
                    console.log('✅ 模型加载成功，系统就绪');
                } else {
                    showAlert('⚠️ 模型未加载，请联系管理员', 'warning');
                }
            } catch (error) {
                console.error('Health check failed:', error);
                showAlert('⚠️ 无法连接到后端服务', 'warning');
            }
        });
    </script>
</body>
</html>
